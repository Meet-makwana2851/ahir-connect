<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Directory — Ahir Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="shared/style.css">
    <script>
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <div class="main-panel main-panel-wide">

            <!-- Directory Heading -->
            <div class="directory-heading">
                <div>
                    <h1 id="dirTitle">👥 Member Directory</h1>
                    <div id="dirSubtitle" style="font-size:13px; color:var(--text-2); margin-top:4px;">Find community members by their name, native village, or profession</div>
                </div>
                <span id="memberCount" style="font-weight:700; color:var(--peacock-teal);"></span>
            </div>

            <!-- Search bar -->
            <div class="search-page-bar" style="margin-bottom:14px;">
                <span class="search-icon">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input type="text" id="userSearch" placeholder="Search by name, native village or profession...">
            </div>

            <!-- Quick Filter Row -->
            <div class="directory-filter-row">
                <select class="directory-filter-select" id="filterDistrict" onchange="applyFilters()">
                    <option value="" id="optAllDistricts">All Districts</option>
                    <option value="Junagadh">Junagadh (જૂનાગઢ)</option>
                    <option value="Kutch">Kutch (કચ્છ)</option>
                    <option value="Jamnagar">Jamnagar (જામનગર)</option>
                    <option value="Rajkot">Rajkot (રાજકોટ)</option>
                    <option value="Amreli">Amreli (અમરેલી)</option>
                    <option value="Bhavnagar">Bhavnagar (ભાવનગર)</option>
                    <option value="Porbandar">Porbandar (પોરબંદર)</option>
                    <option value="Dwarka">Dwarka (દ્વારકા)</option>
                </select>
            </div>

            <div id="searchResults" class="member-directory"></div>

        </div>
    </div>

    <script src="shared/config.js"></script>
    <script src="shared/i18n.js"></script>
    <script src="shared/utils.js"></script>
    <script>
        let currentUser, currentProfile;
        let allMembers = [];

        (async() => {
            const ctx = await requireAuth();
            if (!ctx) return;
            currentUser = ctx.user;
            currentProfile = ctx.profile;
            renderSidebar('search', currentUser, currentProfile);
            applyI18nDirectory();
            loadMembers();
        })();

        function applyI18nDirectory() {
            document.getElementById('userSearch').placeholder = t('searchPlaceholder');
            document.getElementById('optAllDistricts').textContent = t('allDistricts');
        }

        /* ---- Member directory ---- */
        async function loadMembers() {
            const results = document.getElementById('searchResults');
            results.innerHTML = `<div class="empty-state">Loading members...</div>`;

            const { data: members, error } = await sb
                .from('profiles')
                .select('id, name, avatar_url, bio, gam, district, profession')
                .order('name');

            if (error) {
                results.innerHTML = `<div class="empty-state">Unable to load members.</div>`;
                return;
            }
            allMembers = members || [];
            applyFilters();
        }

        function applyFilters() {
            const term = (document.getElementById('userSearch').value || '').trim().toLowerCase();
            const district = document.getElementById('filterDistrict').value.toLowerCase();

            const filtered = allMembers.filter(u => {
                const nameMatch = (u.name || '').toLowerCase().includes(term);
                const gamMatch = (u.gam || '').toLowerCase().includes(term);
                const profMatch = (u.profession || '').toLowerCase().includes(term);
                const matchesTerm = !term || (nameMatch || gamMatch || profMatch);

                const matchesDistrict = !district ||
                    (u.district || '').toLowerCase().includes(district) ||
                    (u.gam || '').toLowerCase().includes(district);

                return matchesTerm && matchesDistrict;
            });

            renderMembersList(filtered);
        }

        function renderMembersList(members) {
            const results = document.getElementById('searchResults');
            const label = t('membersFound');
            document.getElementById('memberCount').textContent = `${members.length} ${label}`;

            if (members.length === 0) {
                results.innerHTML = `<div class="empty-state"><div class="big">🔍</div>${t('noMembers')}</div>`;
                return;
            }

            results.innerHTML = members.map(u => `
                <div class="user-row" onclick="window.location.href='profile.html?id=${u.id}'" style="cursor:pointer;">
                    <a class="profile-link" href="profile.html?id=${u.id}" onclick="event.stopPropagation()">
                        <img class="avatar" src="${u.avatar_url || defaultAvatar(u.name)}" alt="${escapeHtml(u.name || 'Member')}">
                    </a>
                    <div class="user-row-info">
                        <div class="post-author-name-row">
                            <a class="name" href="profile.html?id=${u.id}" onclick="event.stopPropagation()">${escapeHtml(u.name || 'Member')}</a>
                        </div>
                        ${u.gam ? `<div style="font-size:12px; color:var(--peacock-teal); font-weight:600; margin-top:2px;">📍 ${t('gamLabel')}: ${escapeHtml(u.gam)}${u.district ? ` (${escapeHtml(u.district)})` : ''}</div>` : ''}
                        ${u.profession ? `<div style="font-size:11.5px; color:var(--text-2); margin-top:2px;">💼 ${escapeHtml(u.profession)}</div>` : ''}
                        ${u.bio ? `<div class="sub">${escapeHtml(u.bio)}</div>` : ''}
                    </div>
                    <button class="small-btn btn-add" onclick="event.stopPropagation(); window.location.href='profile.html?id=${u.id}'" style="border-radius:9999px;">${t('viewProfile')}</button>
                </div>
            `).join('');
        }

        /* ---- Live search listener ---- */
        let searchTimeout;
        document.getElementById('userSearch').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 200);
        });
    </script>
</body>

</html>
