<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More — AhirConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<div class="feather-bg"></div>
<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main-panel" style="max-width:560px;">
    <h2 class="panel-title">More</h2>

    <!-- Primary actions -->
    <div class="settings-card" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;">

      <a href="profile.html" class="settings-row" style="text-decoration:none;color:inherit;">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        Settings
        <span class="settings-row-chevron">›</span>
      </a>

      <button class="settings-row" id="activityBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </span>
        Your Activity
        <span class="settings-row-chevron">›</span>
      </button>

      <button class="settings-row" id="savedBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </span>
        Saved
        <span class="settings-row-chevron">›</span>
      </button>

      <button class="settings-row" id="appearanceBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
        Switch appearance
        <span class="appearance-toggle" id="appearanceToggle">
          <span class="toggle-pill" id="togglePill"></span>
        </span>
      </button>

      <button class="settings-row" id="reportBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </span>
        Report a problem
        <span class="settings-row-chevron">›</span>
      </button>
    </div>

    <!-- Switch accounts -->
    <div class="settings-card" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;">
      <button class="settings-row" id="switchAccountBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        Switch accounts
        <span class="settings-row-chevron">›</span>
      </button>
    </div>

    <!-- Log out -->
    <div class="settings-card" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden;">
      <button class="settings-row" id="logoutBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </span>
        Log out
      </button>

      <button class="settings-row settings-row-danger" id="deleteAccountBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </span>
        Delete account
      </button>
    </div>

  </div>
</div>

<!-- Report a problem modal -->
<div class="modal-backdrop" id="reportModal" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Report a problem</h3>
      <button class="modal-close" id="closeReportModal">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text-2);margin-bottom:14px;">Describe what went wrong and we'll look into it.</p>
    <textarea id="reportText" rows="5" placeholder="Describe the issue..." style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:var(--font-ui);font-size:14px;background:var(--surface-2);color:var(--text);outline:none;resize:none;"></textarea>
    <button class="btn btn-primary" style="margin-top:12px;" id="submitReportBtn">Send Report</button>
  </div>
</div>

<script src="shared/config.js"></script>
<script src="shared/utils.js"></script>
<script>
let currentUser, currentProfile;

/* ---- Apply saved appearance on load ---- */
(function(){
  if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
})();

(async () => {
  const ctx = await requireAuth();
  if(!ctx) return;
  currentUser = ctx.user; currentProfile = ctx.profile;
  renderSidebar('more', currentUser, currentProfile);
  updateToggleUI();
})();

/* ---- Appearance toggle ---- */
function updateToggleUI(){
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('togglePill').style.transform = isDark ? 'translateX(20px)' : 'translateX(0)';
  document.getElementById('appearanceToggle').style.background = isDark ? 'var(--accent)' : 'var(--border)';
}

document.getElementById('appearanceBtn').addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  updateToggleUI();
});

/* ---- Log out ---- */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if(!confirm('Are you sure you want to log out?')) return;
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

/* ---- Switch accounts ---- */
document.getElementById('switchAccountBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

/* ---- Your Activity (placeholder) ---- */
document.getElementById('activityBtn').addEventListener('click', () => {
  window.location.href = 'home.html';
});

/* ---- Saved (placeholder) ---- */
document.getElementById('savedBtn').addEventListener('click', () => {
  alert('Saved posts coming soon!');
});

/* ---- Report a problem ---- */
document.getElementById('reportBtn').addEventListener('click', () => {
  document.getElementById('reportModal').style.display = 'flex';
});
document.getElementById('closeReportModal').addEventListener('click', () => {
  document.getElementById('reportModal').style.display = 'none';
});
document.getElementById('reportModal').addEventListener('click', (e) => {
  if(e.target === document.getElementById('reportModal'))
    document.getElementById('reportModal').style.display = 'none';
});
document.getElementById('submitReportBtn').addEventListener('click', () => {
  const text = document.getElementById('reportText').value.trim();
  if(!text){ alert('Please describe the problem.'); return; }
  // Could POST to an edge function or email — for now just acknowledge
  alert('Thank you! Your report has been submitted.');
  document.getElementById('reportText').value = '';
  document.getElementById('reportModal').style.display = 'none';
});

/* ---- Delete account ---- */
document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
  if(!confirm('This permanently deletes your account, posts, friendships, and messages. This cannot be undone. Continue?')) return;
  const { data: { session } } = await sb.auth.getSession();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-account`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    });
    if(!res.ok) throw new Error(await res.text());
    await sb.auth.signOut();
    alert('Your account has been deleted.');
    window.location.href = 'login.html';
  }catch(err){
    alert('Account deletion isn\'t set up yet — see setup guide. (' + err.message + ')');
  }
});
</script>
</body>
</html>
