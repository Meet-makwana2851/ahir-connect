<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More — AhirConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/style.css">
<script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main-panel">
    <h2 style="font-size:24px;font-weight:700;margin-bottom:24px;">More</h2>

    <!-- Settings card -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px;">
      <a class="settings-row" href="profile.html">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        Settings
        <span class="settings-row-chevron">›</span>
      </a>
      <button class="settings-row" onclick="toggleAppearance()">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
        Switch appearance
        <div class="appearance-toggle" id="appearanceToggle">
          <div class="toggle-pill" id="togglePill"></div>
        </div>
      </button>
      <button class="settings-row" onclick="alert('Activity feature coming soon!')">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </span>
        Your activity
        <span class="settings-row-chevron">›</span>
      </button>
      <button class="settings-row" onclick="alert('Saved feature coming soon!')">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </span>
        Saved
        <span class="settings-row-chevron">›</span>
      </button>
    </div>

    <!-- Danger actions -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px;">
      <button class="settings-row" id="logoutBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </span>
        Log out
      </button>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;">
      <button class="settings-row settings-row-danger" id="deleteBtn">
        <span class="settings-row-icon">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </span>
        Delete account
      </button>
    </div>

  </div>
</div>

<script src="shared/config.js"></script>
<script src="shared/utils.js"></script>
<script>
let currentUser, currentProfile;

(async () => {
  const ctx = await requireAuth();
  if(!ctx) return;
  currentUser = ctx.user; currentProfile = ctx.profile;
  renderSidebar('more', currentUser, currentProfile);
  initAppearance();
})();

/* ---- Appearance toggle ---- */
function initAppearance(){
  const isDark = localStorage.getItem('theme') === 'dark';
  const pill = document.getElementById('togglePill');
  if(isDark && pill) pill.style.transform = 'translateX(18px)';
}

function toggleAppearance(){
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  const pill = document.getElementById('togglePill');
  if(pill) pill.style.transform = isDark ? 'translateX(18px)' : 'translateX(0)';
}

/* ---- Logout ---- */
document.getElementById('logoutBtn').addEventListener('click', async () => {
  if(!confirm('Log out of AhirConnect?')) return;
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

/* ---- Delete account ---- */
document.getElementById('deleteBtn').addEventListener('click', async () => {
  if(!confirm('Are you sure? This action cannot be undone.')) return;
  if(!confirm('This will permanently delete your account and all your data. Proceed?')) return;
  const { error } = await sb.rpc('delete_user');
  if(error) alert('Error: ' + error.message);
  else { await sb.auth.signOut(); window.location.href = 'login.html'; }
});
</script>
</body>
</html>
