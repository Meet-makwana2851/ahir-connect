<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — AhirConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/style.css">
<script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row"><span class="brand">Ahir<span>Connect</span></span></div>
    <div class="tagline">Sign up to see posts and messages from your community.</div>
    <div class="error-msg" id="authError"></div>
    <div class="success-msg" id="authSuccess"></div>

    <form id="signupForm">
      <div class="field"><label>Full Name</label><input type="text" id="signupName" required placeholder="Full Name"></div>
      <div class="field"><label>Email</label><input type="email" id="signupEmail" required placeholder="Email"></div>
      <div class="field"><label>Password</label><input type="password" id="signupPassword" required minlength="6" placeholder="Password"></div>
      <button class="btn btn-primary" type="submit" id="signupBtn" style="margin-top:6px;">Sign up</button>
    </form>

    <div class="or-divider">OR</div>

    <div class="switch-auth">Have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="shared/config.js"></script>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('authError');
  const sucEl = document.getElementById('authSuccess');
  errEl.style.display = 'none'; sucEl.style.display = 'none';
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  const name = document.getElementById('signupName').value.trim();
  const { error } = await sb.auth.signUp({
    email: document.getElementById('signupEmail').value.trim(),
    password: document.getElementById('signupPassword').value,
    options: { data: { name } }
  });

  if(error){
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign up';
  } else {
    sucEl.textContent = 'Account created! Check your email to confirm, then log in.';
    sucEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign up';
  }
});
</script>
</body>
</html>
