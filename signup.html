<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Ahir Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="shared/style.css">
    <script>
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
</head>

<body>
    <div class="auth-wrap">
        <div class="auth-card" style="max-width:380px; border-radius:18px; border:1px solid var(--border-gold); box-shadow:var(--shadow-md);">
            <div class="brand-row">
                <span class="brand"><span style="color:var(--text);">Ahir</span><span style="color:var(--accent);"> Connect</span></span>
            </div>
            <div class="tagline" style="color:var(--text-2); font-weight:500; margin-bottom:18px;">
                <span style="font-size:13px;">Join the digital platform of the Yaduvanshi Samaj</span>
            </div>
            <div class="error-msg" id="authError"></div>
            <div class="success-msg" id="authSuccess"></div>

            <form id="signupForm">
                <div class="field"><label>Full Name</label><input type="text" id="signupName" required placeholder="Your full name"></div>
                <div class="field"><label>Email</label><input type="email" id="signupEmail" required placeholder="Email Address"></div>
                <div class="field"><label for="signupPassword">Password</label><div class="password-field"><input type="password" id="signupPassword" required minlength="6" placeholder="Password"><button class="password-toggle" type="button" data-password-toggle="signupPassword" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.5 17.5 0 0 1-3.1 3.5"/><path d="M6.2 6.2C3.6 8 2 12 2 12s3.5 6 10 6c1.3 0 2.4-.2 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div></div>
                <button class="btn btn-primary" type="submit" id="signupBtn" style="margin-top:8px; border-radius:9999px; background:var(--accent);">Join Ahir Connect</button>
            </form>

            <div class="or-divider">OR</div>

            <div class="switch-auth">Have an account? <a href="login.html" style="font-weight:700; color:var(--peacock-teal);">Log in</a></div>
        </div>
    </div>

    <script src="shared/config.js"></script>
    <script src="shared/i18n.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const errEl = document.getElementById('authError');
            const sucEl = document.getElementById('authSuccess');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';
            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const name = document.getElementById('signupName').value.trim();
            const {
                error
            } = await sb.auth.signUp({
                email: document.getElementById('signupEmail').value.trim(),
                password: document.getElementById('signupPassword').value,
                options: {
                    data: {
                        name
                    }
                }
            });

            if (error) {
                errEl.textContent = error.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Join Ahir Connect';
            } else {
                await sb.auth.signOut();
                window.location.href = 'login.html?created=1';
            }
        });

        document.querySelectorAll('[data-password-toggle]').forEach(toggle => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.dataset.passwordToggle);
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                toggle.querySelector('.eye-open').hidden = !isVisible;
                toggle.querySelector('.eye-closed').hidden = isVisible;
            });
        });
    </script>
</body>

</html>
