<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — AhirConnect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="shared/style.css">
    <script>
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
    <style>
        #detailGrid>div {
            border-bottom: 1px solid var(--border);
        }
        
        #detailGrid>div:nth-last-child(-n+2) {
            border-bottom: none;
        }
        
        @media (max-width: 700px) {
            #detailGrid {
                grid-template-columns: 1fr !important;
            }
            #detailGrid>div:nth-last-child(2) {
                border-bottom: 1px solid var(--border);
            }
            .profile-top-row {
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div id="sidebarMount"></div>

        <div class="main-panel main-panel-wide">

            <!-- Social/community-style profile header -->
            <div class="profile-header" style="align-items:flex-start;">
                <div class="profile-avatar-wrap">
                    <img class="avatar-lg" id="profAvatar" src="" alt="Profile picture">
                </div>
                <div class="profile-info" style="flex:1; min-width:0;">
                    <div class="profile-top-row">
                        <div>
                            <div class="username" id="profName">—</div>
                            <div id="profHeadline" style="margin-top:5px; color:var(--text-2); font-size:14px;"></div>
                            <div id="profLocation" style="margin-top:4px; color:var(--text-2); font-size:14px;"></div>
                        </div>
                        <button class="btn-edit" id="editProfileBtn">Edit profile</button>
                    </div>

                    <div class="profile-stats" style="margin-top:18px;">
                        <span class="stat"><strong id="postCount">0</strong> posts</span>
                        <span class="stat"><strong id="friendCount">0</strong> friends</span>
                    </div>

                    <div class="profile-bio" id="profileBioWrap" style="margin-top:18px;">
                        <span id="profBio"></span>
                    </div>
                </div>
            </div>

            <!-- About / profile information -->
            <section id="profileAbout" style="margin:28px 0 8px; padding:24px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);">
                <div style="font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--text-2); margin-bottom:18px;">ABOUT</div>
                <div id="detailGrid" style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 48px;"></div>
            </section>

            <!-- Tabs -->
            <div class="profile-tabs">
                <button class="profile-tab active" id="tabPosts">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        POSTS
      </button>
            </div>

            <!-- Posts grid -->
            <div class="profile-grid" id="postsGrid"></div>

        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-backdrop" id="editModal" style="display:none;">
        <div class="modal-card" style="max-width:460px; max-height:85vh; overflow-y:auto;">
            <div class="modal-header">
                <span>Edit profile</span>
                <button class="modal-close" id="closeEditModal">✕</button>
            </div>
            <div class="modal-body">
                <div class="field" style="margin-bottom:14px;">
                    <label>Bio</label>
                    <textarea id="editBio" rows="3" placeholder="Tell people about yourself..."></textarea>
                </div>

                <div class="form-section-label" style="margin-top:0;">Profile Details</div>
                <div class="field"><label>Residence City</label><input type="text" id="editCity"></div>
                <div class="field"><label>Educational Background</label><input type="text" id="editEducation"></div>

                <div class="field-row">
                    <div class="field"><label>Occupation</label>
                        <select id="editOccType">
            <option value="student">Student</option>
            <option value="government">Government Sector</option>
            <option value="private">Private Sector</option>
          </select>
                    </div>
                    <div class="field"><label>Field of Work</label>
                        <select id="editOccField">
            <option value="IT">IT</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Business">Business</option>
            <option value="Agriculture">Agriculture</option>
            <option value="Engineering">Engineering</option>
            <option value="Finance">Finance</option>
            <option value="other">Other</option>
          </select>
                    </div>
                </div>
                <div class="field" id="editOccOtherWrap" style="display:none;"><label>Please specify</label><input type="text" id="editOccOther"></div>

                <div class="field"><label>Past Work Experience</label><textarea id="editPastExp" rows="2"></textarea></div>
                <div class="field-row">
                    <div class="field"><label>Birth Date</label><input type="date" id="editBirthDate"></div>
                    <div class="field"><label>Marital Status</label>
                        <select id="editMaritalStatus">
            <option value="">Prefer not to say</option>
            <option value="single">Single</option>
            <option value="married">Married</option>
          </select>
                    </div>
                </div>

                <button class="btn btn-primary" id="saveProfileBtn" style="border-radius:8px; margin-top:6px;">Save</button>
            </div>
        </div>
    </div>

    <script src="shared/config.js"></script>
    <script src="shared/utils.js"></script>
    <script>
        let currentUser, currentProfile;

        (async() => {
            const ctx = await requireAuth();
            if (!ctx) return;
            currentUser = ctx.user;
            currentProfile = ctx.profile;
            renderSidebar('profile', currentUser, currentProfile);

            document.getElementById('profAvatar').src = currentProfile.avatar_url || defaultAvatar(currentProfile.name);
            document.getElementById('profName').textContent = currentProfile.name || 'Member';
            updateProfileHeader(currentProfile);

            renderDetailGrid(currentProfile);
            fillEditForm(currentProfile);

            loadProfileStats();
            loadProfilePosts();
        })();

        function updateProfileHeader(p) {
            document.getElementById('profName').textContent = p.name || 'Member';
            document.getElementById('profHeadline').textContent = occLabel(p);
            document.getElementById('profLocation').textContent = p.residence_city ? `📍 ${p.residence_city}` : '';

            const bioWrap = document.getElementById('profileBioWrap');
            const bio = (p.bio || '').trim();
            document.getElementById('profBio').textContent = bio;
            bioWrap.style.display = bio ? 'block' : 'none';
        }

        function occLabel(p) {
            if (!p.occupation_type) return '';
            const map = {
                student: 'Student',
                government: 'Government Sector',
                private: 'Private Sector'
            };
            const base = map[p.occupation_type] || p.occupation_type;
            return p.occupation_field ? `${base} — ${p.occupation_field}` : base;
        }

        function maritalLabel(v) {
            return v === 'single' ? 'Single' : v === 'married' ? 'Married' : '';
        }

        function formatBirthDate(value) {
            if (!value) return '';
            const d = new Date(value + 'T00:00:00');
            if (Number.isNaN(d.getTime())) return value;
            return d.toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function renderDetailGrid(p) {
            const grid = document.getElementById('detailGrid');
            const rows = [
                ['🎓', 'Education', p.education],
                ['💼', 'Occupation', occLabel(p)],
                ['📍', 'Residence', p.residence_city],
                ['🧑‍💻', 'Past Work Experience', p.past_experience],
                ['🎂', 'Birth Date', formatBirthDate(p.birth_date)],
                ['💍', 'Marital Status', maritalLabel(p.marital_status)]
            ].filter(r => r[2]);

            if (rows.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; color:var(--text-2); font-size:14px;">No profile details added yet. Click "Edit profile" to add some.</div>`;
                return;
            }

            grid.innerHTML = rows.map(r => `
    <div style="display:flex; gap:12px; padding:14px 0; min-width:0;">
      <div style="width:32px; height:32px; flex:0 0 32px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:var(--surface-2); font-size:16px;">${r[0]}</div>
      <div style="min-width:0;">
        <div style="font-size:12px; color:var(--text-2); margin-bottom:4px;">${r[1]}</div>
        <div style="font-size:14px; color:var(--text); line-height:1.45; word-break:break-word;">${escapeHtml(String(r[2]))}</div>
      </div>
    </div>`).join('');
        }

        function fillEditForm(p) {
            document.getElementById('editBio').value = p.bio || '';
            document.getElementById('editCity').value = p.residence_city || '';
            document.getElementById('editEducation').value = p.education || '';
            document.getElementById('editOccType').value = p.occupation_type || 'student';
            const knownFields = ['IT', 'Healthcare', 'Education', 'Business', 'Agriculture', 'Engineering', 'Finance'];
            if (p.occupation_field && !knownFields.includes(p.occupation_field)) {
                document.getElementById('editOccField').value = 'other';
                document.getElementById('editOccOther').value = p.occupation_field;
                document.getElementById('editOccOtherWrap').style.display = 'block';
            } else {
                document.getElementById('editOccField').value = p.occupation_field || 'IT';
            }
            document.getElementById('editPastExp').value = p.past_experience || '';
            document.getElementById('editBirthDate').value = p.birth_date || '';
            document.getElementById('editMaritalStatus').value = p.marital_status || '';
        }

        document.getElementById('editOccField').addEventListener('change', (e) => {
            document.getElementById('editOccOtherWrap').style.display = e.target.value === 'other' ? 'block' : 'none';
        });

        async function loadProfileStats() {
            const [postsRes, friendsRes] = await Promise.all([
                sb.from('posts').select('*', {
                    count: 'exact',
                    head: true
                }).eq('author_id', currentUser.id),
                sb.from('friendships').select('*', {
                    count: 'exact',
                    head: true
                }).eq('user_id', currentUser.id),
            ]);
            document.getElementById('postCount').textContent = postsRes.count || 0;
            document.getElementById('friendCount').textContent = friendsRes.count || 0;
        }

        async function loadProfilePosts() {
            const grid = document.getElementById('postsGrid');
            const {
                data: posts
            } = await sb.from('posts')
                .select('id, media_url, media_type, caption')
                .eq('author_id', currentUser.id)
                .order('created_at', {
                    ascending: false
                });

            if (!posts || posts.length === 0) {
                grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="big">📷</div>No posts yet</div>`;
                return;
            }

            grid.innerHTML = posts.map(p => {
                        if (p.media_url) {
                            return `<div class="profile-grid-item">
        ${p.media_type === 'video'
          ? `<video src="${p.media_url}" muted></video>`
          : `<img src="${p.media_url}" loading="lazy">`}
      </div>`;
    } else {
      return `<div class="profile-grid-item" style="display:flex;align-items:center;justify-content:center;padding:16px;font-size:13px;color:var(--text);background:var(--surface-2);text-align:center;">
        ${escapeHtml(p.caption).substring(0, 80)}${p.caption.length > 80 ? '…' : ''}
      </div>`;
    }
  }).join('');
}

/* Edit profile modal */
document.getElementById('editProfileBtn').addEventListener('click', () => {
  document.getElementById('editModal').style.display = 'flex';
});
document.getElementById('closeEditModal').addEventListener('click', () => {
  document.getElementById('editModal').style.display = 'none';
});
document.getElementById('editModal').addEventListener('click', (e) => {
  if(e.target === document.getElementById('editModal'))
    document.getElementById('closeEditModal').click();
});

document.getElementById('saveProfileBtn').addEventListener('click', async () => {
  const occField = document.getElementById('editOccField').value;
  const occOther = document.getElementById('editOccOther').value.trim();

  const updates = {
    bio: document.getElementById('editBio').value.trim(),
    residence_city: document.getElementById('editCity').value.trim(),
    education: document.getElementById('editEducation').value.trim(),
    occupation_type: document.getElementById('editOccType').value,
    occupation_field: occField === 'other' ? occOther : occField,
    past_experience: document.getElementById('editPastExp').value.trim(),
    birth_date: document.getElementById('editBirthDate').value || null,
    marital_status: document.getElementById('editMaritalStatus').value
  };

  const { error } = await sb.from('profiles').update(updates).eq('id', currentUser.id);
  if(error){ alert('Error: ' + error.message); return; }

  Object.assign(currentProfile, updates);
  updateProfileHeader(currentProfile);
  renderDetailGrid(currentProfile);
  document.getElementById('closeEditModal').click();
});
    </script>
</body>

</html>
