<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — AhirConnect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/style.css">
<script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
<div class="feather-bg"></div>
<div class="app-shell">
  <div id="sidebarMount"></div>

  <div class="main-panel">
    <h2 class="panel-title">My Profile</h2>

    <!-- Profile card -->
    <div class="profile-card" style="margin-bottom:16px;">
      <img class="avatar avatar-lg" id="profAvatar" src="">
      <h3 id="profName" style="margin-top:10px; font-size:18px;">—</h3>
      <p style="color:var(--text-3); font-size:13px; margin:4px 0 0;" id="profEmail">—</p>
    </div>

    <!-- Account Settings card -->
    <div class="settings-card" style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); margin-bottom:16px; overflow:hidden;">
      <div class="settings-section-header">Account</div>
      <div style="padding:16px 20px;">
        <div class="field">
          <label>Bio</label>
          <textarea id="profBio" rows="3" placeholder="Tell the samaj about yourself..."></textarea>
        </div>
        <button class="btn btn-primary" id="saveProfileBtn" style="margin-top:4px;">Save Changes</button>
      </div>
    </div>

  </div>
</div>

<script src="shared/config.js"></script>
<script src="shared/utils.js"></script>
<script>
let currentUser, currentProfile;

(async () => {
  const ctx = await requireAuth();
  if(!ctx) return;
  currentUser = ctx.user; currentProfile = ctx.profile;
  renderSidebar('profile', currentUser, currentProfile);

  document.getElementById('profName').textContent = currentProfile.name || 'Member';
  document.getElementById('profEmail').textContent = currentUser.email || '';
  document.getElementById('profAvatar').src = currentProfile.avatar_url || defaultAvatar(currentProfile.name);
  document.getElementById('profBio').value = currentProfile.bio || '';
})();

document.getElementById('saveProfileBtn').onclick = async () => {
  const bio = document.getElementById('profBio').value.trim();
  const { error } = await sb.from('profiles').update({ bio }).eq('id', currentUser.id);
  if(error){ alert('Error saving: ' + error.message); return; }
  alert('Profile updated!');
};

</script>
</body>
</html>
