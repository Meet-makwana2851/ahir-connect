<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Ahir Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="shared/style.css">
    <script>if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");</script>
    <style>
        #detailGrid>div { border-bottom: 1px solid var(--border); }
        #detailGrid>div:nth-last-child(-n+2) { border-bottom: none; }
        @media (max-width: 700px) {
            #detailGrid { grid-template-columns: 1fr !important; }
            #detailGrid>div:nth-last-child(2) { border-bottom: 1px solid var(--border); }
            .profile-top-row { align-items: flex-start; gap: 12px; }
        }
        .stat-btn { background:none; border:none; padding:0; cursor:pointer; font:inherit; color:inherit; }
        .stat-btn:hover strong { color: var(--accent); }

        /* Friends Modal */
        .friends-list { overflow-y:auto; flex:1; max-height:60vh; }
        .friend-row { display:flex; align-items:center; gap:12px; padding:10px 16px; text-decoration:none; color:inherit; border-bottom:1px solid var(--border-soft); transition:background .12s; }
        .friend-row:hover { background:var(--surface-2); }
        .friend-row img { width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
        .friend-row-name { font-weight:600; font-size:14px; }
        .friend-row-sub { font-size:12px; color:var(--text-2); margin-top:1px; }

        /* Post Popup Modal */
        #postModal .modal-card { width:75vw; height:75vh; max-width:1100px; max-height:90vh; display:flex; flex-direction:row; overflow:hidden; padding:0; border-radius:var(--radius-lg); }
        .post-modal-media { flex:1; background:#000; display:flex; align-items:center; justify-content:center; min-width:0; }
        .post-modal-media img, .post-modal-media video { width:100%; height:100%; object-fit:contain; max-height:75vh; }
        .post-modal-sidebar { width:380px; flex-shrink:0; display:flex; flex-direction:column; border-left:1px solid var(--border); background:var(--surface); }
        .post-modal-header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
        .post-modal-header img { width:34px; height:34px; border-radius:50%; object-fit:cover; }
        .post-modal-header .author-name { font-weight:600; font-size:14px; text-decoration:none; color:var(--text); }
        .post-modal-close { margin-left:auto; background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-2); padding:0 4px; }
        .post-modal-comments { flex:1; overflow-y:auto; padding:12px 16px; }
        .post-modal-caption { padding:0 0 10px; font-size:14px; border-bottom:1px solid var(--border-soft); margin-bottom:10px; line-height:1.5; }
        .post-modal-caption strong { font-weight:600; margin-right:6px; }
        .pm-comment { display:flex; gap:8px; margin-bottom:10px; font-size:13.5px; }
        .pm-comment img { width:28px; height:28px; border-radius:50%; object-fit:cover; flex-shrink:0; }
        .pm-comment-body { line-height:1.4; }
        .pm-comment-body strong { font-weight:600; margin-right:4px; }
        .pm-time { font-size:11px; color:var(--text-3); margin-top:2px; }
        .post-modal-actions { padding:10px 16px; border-top:1px solid var(--border); flex-shrink:0; }
        .post-modal-like-row { display:flex; align-items:center; gap:14px; margin-bottom:8px; }
        .pm-like-btn { background:none; border:none; cursor:pointer; font-size:22px; padding:0; transition:transform .15s; }
        .pm-like-btn:hover { transform:scale(1.2); }
        .post-modal-like-count { font-weight:700; font-size:13px; }
        .post-modal-input-row { display:flex; gap:8px; border-top:1px solid var(--border-soft); padding-top:8px; }
        .post-modal-input-row input { flex:1; border:none; outline:none; font-size:14px; background:transparent; color:var(--text); }
        .post-modal-input-row button { background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; font-size:14px; padding:0; }
        .post-modal-input-row button:disabled { opacity:0.4; }
        @media (max-width:640px) {
            #postModal .modal-card { flex-direction:column; max-width:100vw; border-radius:0; }
            .post-modal-media { max-width:100%; max-height:40vh; }
            .post-modal-sidebar { width:100%; border-left:none; border-top:1px solid var(--border); }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-panel main-panel-wide">

        <!-- Profile header -->
        <div class="profile-header" style="align-items:flex-start;">
            <div class="profile-avatar-wrap">
                <img class="avatar-lg" id="profAvatar" src="" alt="Profile picture">
            </div>
            <div class="profile-info" style="flex:1; min-width:0;">
                <div class="profile-top-row">
                    <div>
                        <div class="username" id="profName">—</div>
                        <div id="profHeadline" style="margin-top:5px; color:var(--text-2); font-size:14px;"></div>
                        <div id="profLocation" style="margin-top:4px; color:var(--text-2); font-size:14px;"></div>
                    </div>
                    <button class="btn-edit" id="editProfileBtn">Edit profile</button>
                </div>
                <div class="profile-stats" style="margin-top:18px;">
                    <span class="stat"><strong id="postCount">0</strong> posts</span>
                    <button class="stat stat-btn" onclick="openFriendsModal()"><strong id="friendCount">0</strong> friends</button>
                </div>
                <div class="profile-bio" id="profileBioWrap"><span id="profBio"></span></div>
            </div>
        </div>

        <!-- About -->
        <section id="profileAbout" style="margin:28px 0 8px; padding:24px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);">
            <div style="font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--text-2); margin-bottom:18px;"><span id="aboutLabel">ABOUT</span></div>
            <div id="detailGrid" style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 48px;"></div>
        </section>

        <!-- Tabs -->
        <div class="profile-tabs">
            <button class="profile-tab active" id="tabPosts">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                <span id="postsLabel">POSTS</span>
            </button>
        </div>
        <div class="profile-grid" id="postsGrid"></div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal-backdrop" id="editModal" style="display:none;">
    <div class="modal-card" style="max-width:460px; max-height:85vh; overflow-y:auto;">
        <div class="modal-header"><span>Edit profile</span><button class="modal-close" id="closeEditModal">✕</button></div>
        <div class="modal-body">
            <div class="field" style="margin-bottom:14px;"><label>Bio</label><textarea id="editBio" rows="3" placeholder="Tell people about yourself..."></textarea></div>
            <div class="form-section-label" style="margin-top:14px; font-weight:700; color:var(--text-2); margin-bottom:8px;">Personal Details</div>
            <div class="field"><label>Residential City or Village</label><input type="text" id="editCity" list="residenceSuggestions" placeholder="e.g. Ahmedabad or Junagadh"><datalist id="residenceSuggestions"></datalist></div>
            <div class="field"><label>Educational Background</label><input type="text" id="editEducation"></div>
            <div class="field-row">
                <div class="field"><label>Occupation</label>
                    <select id="editOccType">
                        <option value="">— Not set —</option>
                        <option value="student">Student</option>
                        <option value="government">Government Sector</option>
                        <option value="private">Private Sector</option>
                    </select>
                </div>
                <div class="field"><label>Field of Work</label>
                    <select id="editOccField">
                        <option value="">— Not set —</option>
                        <option value="IT">IT</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Business">Business</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Finance">Finance</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div class="field" id="editOccOtherWrap" style="display:none;"><label>Please specify</label><input type="text" id="editOccOther"></div>
            <div class="field"><label>Past Work Experience</label><textarea id="editPastExp" rows="2"></textarea></div>
            <div class="field-row">
                <div class="field"><label>Birth Date</label><input type="date" id="editBirthDate"></div>
                <div class="field"><label>Marital Status</label>
                    <select id="editMaritalStatus">
                        <option value="">Prefer not to say</option>
                        <option value="single">Single</option>
                        <option value="married">Married</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" id="saveProfileBtn" style="border-radius:8px; margin-top:6px;">Save</button>
        </div>
    </div>
</div>

<!-- Friends Modal -->
<div class="modal-backdrop" id="friendsModal" style="display:none;">
    <div class="modal-card" style="max-width:380px; max-height:75vh; display:flex; flex-direction:column; padding:0; overflow:hidden;">
        <div class="modal-header" style="padding:14px 16px; flex-shrink:0; border-bottom:1px solid var(--border);">
            <span style="font-weight:700; font-size:16px;">Friends</span>
            <button class="modal-close" onclick="closeFriendsModal()">✕</button>
        </div>
        <div class="friends-list" id="friendsList"><div class="empty-state">Loading...</div></div>
    </div>
</div>

<!-- Post Popup Modal -->
<div class="modal-backdrop" id="postModal" style="display:none;">
    <div class="modal-card" style="padding:0;">
        <div class="post-modal-media" id="postModalMedia"></div>
        <div class="post-modal-sidebar">
            <div class="post-modal-header">
                <img id="pmAuthorAvatar" src="" alt="">
                <a class="author-name" id="pmAuthorName" href="#"></a>
                <button class="post-modal-close" onclick="closePostModal()">✕</button>
            </div>
            <div class="post-modal-comments" id="pmComments"></div>
            <div class="post-modal-actions">
                <div class="post-modal-like-row">
                    <button class="pm-like-btn" id="pmLikeBtn" onclick="togglePostModalLike()">🤍</button>
                    <span class="post-modal-like-count" id="pmLikeCount">0 likes</span>
                </div>
                <div class="post-modal-input-row">
                    <input type="text" id="pmCommentInput" placeholder="Add a comment…" maxlength="300">
                    <button id="pmCommentPost" onclick="postModalComment()" disabled>Post</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="shared/config.js"></script>
<script src="shared/i18n.js"></script>
<script src="shared/utils.js"></script>
<script src="villagesByDistrict.js"></script>
<script>
let currentUser, currentProfile;
let profilePosts = [];
let currentPostId = null;
let pmLiked = false;
let pmLikeCount = 0;

(async () => {
    const ctx = await requireAuth();
    if (!ctx) return;
    currentUser = ctx.user;
    currentProfile = ctx.profile;
    const requestedId = new URLSearchParams(window.location.search).get('id');
    const isOwnProfile = !requestedId || requestedId === currentUser.id;
    if (!isOwnProfile) {
        const { data: viewedProfile, error } = await sb.from('profiles').select('*').eq('id', requestedId).single();
        if (error || !viewedProfile) { window.location.href = 'friends.html'; return; }
        currentProfile = viewedProfile;
        document.getElementById('editProfileBtn').style.display = 'none';
        document.getElementById('profileAbout').style.display = 'none';
    }
    renderSidebar(isOwnProfile ? 'profile' : '', currentUser, ctx.profile);
    applyProfileLanguage();
    document.getElementById('profAvatar').src = currentProfile.avatar_url || defaultAvatar(currentProfile.name);
    updateProfileHeader(currentProfile);
    renderDetailGrid(currentProfile);
    fillEditForm(currentProfile);
    loadProfileStats();
    loadProfilePosts();
})();

function applyProfileLanguage() {
    document.documentElement.lang = getCurrentLang();
    document.getElementById('editProfileBtn').textContent = t('editProfileAction');
    document.getElementById('aboutLabel').textContent = t('about');
    document.getElementById('postsLabel').textContent = t('posts');
    document.getElementById('editBio').placeholder = t('tellAbout');
    document.getElementById('editCity').previousElementSibling.textContent = t('residentialCityVillage');
    document.getElementById('editEducation').previousElementSibling.textContent = t('educationalBackground');
    document.getElementById('editOccType').previousElementSibling.textContent = t('occupation');
    document.getElementById('editOccField').previousElementSibling.textContent = t('fieldOfWork');
    document.getElementById('editPastExp').previousElementSibling.textContent = t('pastWorkExperience');
    document.getElementById('editBirthDate').previousElementSibling.textContent = t('birthDate');
    document.getElementById('editMaritalStatus').previousElementSibling.textContent = t('maritalStatus');
    const occOpts = document.querySelectorAll('#editOccType option');
    if (occOpts.length >= 4 && getCurrentLang() === 'gu') {
        occOpts[0].textContent = '— સેટ નથી —'; occOpts[1].textContent = 'વિદ્યાર્થી';
        occOpts[2].textContent = 'સરકારી ક્ષેત્ર'; occOpts[3].textContent = 'ખાનગી ક્ષેત્ર';
    }
    const fieldOpts = document.querySelectorAll('#editOccField option');
    const guF = ['— સેટ નથી —','આઈટી','આરોગ્યસંભાળ','શિક્ષણ','વ્યવસાય','કૃષિ','એન્જિનિયરિંગ','નાણાં','અન્ય'];
    if (getCurrentLang() === 'gu') fieldOpts.forEach((o, i) => { o.textContent = guF[i] || o.textContent; });
}

function updateProfileHeader(p) {
    document.getElementById('profName').textContent = p.name || 'Member';
    let loc = [];
    if (p.gam) loc.push('📍 Native Village: ' + p.gam);
    if (p.district) loc.push('(' + p.district + ')');
    if (p.residence_city) loc.push('• Currently in: ' + p.residence_city);
    document.getElementById('profHeadline').textContent = p.profession ? '💼 ' + p.profession : occLabel(p);
    document.getElementById('profLocation').textContent = loc.join(' ');
    const bio = (p.bio || '').trim();
    document.getElementById('profBio').textContent = bio;
    document.getElementById('profileBioWrap').style.display = bio ? 'block' : 'none';
}

function occLabel(p) {
    if (!p.occupation_type) return '';
    if (getCurrentLang() === 'gu') {
        const gm = { student:'વિદ્યાર્થી', government:'સરકારી ક્ષેત્ર', private:'ખાનગી ક્ષેત્ર' };
        const gf = { IT:'આઈટી', Healthcare:'આરોગ્યસંભાળ', Education:'શિક્ષણ', Business:'વ્યવસાય', Agriculture:'કૃષિ', Engineering:'એન્જિનિયરિંગ', Finance:'નાણાં' };
        const base = gm[p.occupation_type] || p.occupation_type;
        const field = gf[p.occupation_field] || p.occupation_field;
        return field ? base + ' — ' + field : base;
    }
    const m = { student:'Student', government:'Government Sector', private:'Private Sector' };
    const base = m[p.occupation_type] || p.occupation_type;
    return p.occupation_field ? base + ' — ' + p.occupation_field : base;
}

function maritalLabel(v) {
    if (getCurrentLang() === 'gu') return v === 'single' ? 'અપરિણીત' : v === 'married' ? 'પરિણીત' : '';
    return v === 'single' ? 'Single' : v === 'married' ? 'Married' : '';
}

function formatBirthDate(value) {
    if (!value) return '';
    const d = new Date(value + 'T00:00:00');
    if (Number.isNaN(d.getTime())) return value;
    return d.toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' });
}

function renderDetailGrid(p) {
    const grid = document.getElementById('detailGrid');
    const rows = [
        ['🎓', t('education'), p.education],
        ['🏙️', t('currentResidence'), p.residence_city],
        ['🧑‍💻', t('workExperience'), p.past_experience],
        ['🎂', t('birthDate'), formatBirthDate(p.birth_date)],
        ['💍', t('maritalStatus'), maritalLabel(p.marital_status)]
    ].filter(r => r[2]);
    if (rows.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1; color:var(--text-2); font-size:14px;">' + t('noProfileDetails') + '</div>'; return; }
    grid.innerHTML = rows.map(r => '<div style="display:flex; gap:12px; padding:14px 0; min-width:0;"><div style="width:32px; height:32px; flex:0 0 32px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:var(--surface-2); font-size:16px;">' + r[0] + '</div><div style="min-width:0;"><div style="font-size:12px; color:var(--text-2); margin-bottom:4px;">' + r[1] + '</div><div style="font-size:14px; color:var(--text); line-height:1.45; word-break:break-word; font-weight:600;">' + escapeHtml(String(r[2])) + '</div></div></div>').join('');
}

function fillEditForm(p) {
    document.getElementById('editBio').value = p.bio || '';
    document.getElementById('editCity').value = p.residence_city || '';
    document.getElementById('editEducation').value = p.education || '';
    document.getElementById('editOccType').value = p.occupation_type || '';
    const kf = ['IT','Healthcare','Education','Business','Agriculture','Engineering','Finance'];
    if (p.occupation_field && !kf.includes(p.occupation_field)) {
        document.getElementById('editOccField').value = 'other';
        document.getElementById('editOccOther').value = p.occupation_field;
        document.getElementById('editOccOtherWrap').style.display = 'block';
    } else { document.getElementById('editOccField').value = p.occupation_field || ''; }
    document.getElementById('editPastExp').value = p.past_experience || '';
    document.getElementById('editBirthDate').value = p.birth_date || '';
    document.getElementById('editMaritalStatus').value = p.marital_status || '';
}

function updateResidenceSuggestions() {
    const term = document.getElementById('editCity').value.trim().toLowerCase();
    const s = allVillages.map(v => v.name).filter((n, i, a) => a.indexOf(n) === i)
        .filter(n => !term || n.toLowerCase().includes(term)).sort((a, b) => a.localeCompare(b)).slice(0, 50);
    document.getElementById('residenceSuggestions').innerHTML = s.map(n => '<option value="' + escapeHtml(n) + '"></option>').join('');
}
document.getElementById('editCity').addEventListener('focus', updateResidenceSuggestions);
document.getElementById('editCity').addEventListener('input', updateResidenceSuggestions);
document.getElementById('editOccField').addEventListener('change', e => {
    document.getElementById('editOccOtherWrap').style.display = e.target.value === 'other' ? 'block' : 'none';
});

async function loadProfileStats() {
    const [postsRes, friendsRes] = await Promise.all([
        sb.from('posts').select('*', { count:'exact', head:true }).eq('author_id', currentProfile.id),
        sb.from('friendships').select('*', { count:'exact', head:true }).eq('user_id', currentProfile.id),
    ]);
    document.getElementById('postCount').textContent = postsRes.count || 0;
    document.getElementById('friendCount').textContent = friendsRes.count || 0;
}

async function loadProfilePosts() {
    const grid = document.getElementById('postsGrid');
    const { data: posts } = await sb.from('posts')
        .select('id, media_url, media_type, caption')
        .eq('author_id', currentProfile.id)
        .order('created_at', { ascending: false });
    profilePosts = posts || [];
    if (!posts || posts.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="big">📷</div>No posts yet</div>';
        return;
    }
    grid.innerHTML = posts.map((p, i) => {
        if (p.media_url) {
            return '<div class="profile-grid-item" onclick="openPostModal(' + i + ')" style="cursor:pointer;">' +
                (p.media_type === 'video' ? '<video src="' + p.media_url + '" muted></video>' : '<img src="' + p.media_url + '" loading="lazy">') +
                '</div>';
        }
        return '<div class="profile-grid-item" onclick="openPostModal(' + i + ')" style="cursor:pointer; display:flex;align-items:center;justify-content:center;padding:16px;font-size:13px;color:var(--text);background:var(--surface-2);text-align:center;">' +
            escapeHtml(p.caption || '').substring(0, 80) + (p.caption && p.caption.length > 80 ? '…' : '') + '</div>';
    }).join('');
}

/* ---- FRIENDS MODAL ---- */
async function openFriendsModal() {
    document.getElementById('friendsModal').style.display = 'flex';
    const listEl = document.getElementById('friendsList');
    listEl.innerHTML = '<div class="empty-state">Loading...</div>';
    const { data, error } = await sb.from('friendships')
        .select('friend_id, profiles:friend_id(id, name, avatar_url, residence_city, occupation_field)')
        .eq('user_id', currentProfile.id);
    if (error || !data || data.length === 0) { listEl.innerHTML = '<div class="empty-state">No friends yet.</div>'; return; }
    listEl.innerHTML = data.map(f => {
        const u = f.profiles || {};
        const sub = [u.residence_city, u.occupation_field].filter(Boolean).join(' · ');
        return '<a class="friend-row" href="profile.html?id=' + u.id + '">' +
            '<img src="' + (u.avatar_url || defaultAvatar(u.name)) + '" alt="' + escapeHtml(u.name || '') + '">' +
            '<div><div class="friend-row-name">' + escapeHtml(u.name || 'Member') + '</div>' +
            (sub ? '<div class="friend-row-sub">' + escapeHtml(sub) + '</div>' : '') +
            '</div></a>';
    }).join('');
}
function closeFriendsModal() { document.getElementById('friendsModal').style.display = 'none'; }
document.getElementById('friendsModal').addEventListener('click', e => { if (e.target === document.getElementById('friendsModal')) closeFriendsModal(); });

/* ---- POST POPUP MODAL ---- */
async function openPostModal(index) {
    const post = profilePosts[index];
    if (!post) return;
    currentPostId = post.id;
    const mediaEl = document.getElementById('postModalMedia');
    if (post.media_url) {
        mediaEl.style.display = 'flex';
        mediaEl.innerHTML = post.media_type === 'video'
            ? '<video src="' + post.media_url + '" controls autoplay muted style="max-height:90vh;width:100%;"></video>'
            : '<img src="' + post.media_url + '" alt="post">';
    } else { mediaEl.style.display = 'none'; }
    document.getElementById('pmAuthorAvatar').src = currentProfile.avatar_url || defaultAvatar(currentProfile.name);
    document.getElementById('pmAuthorName').textContent = currentProfile.name || 'Member';
    document.getElementById('pmAuthorName').href = 'profile.html?id=' + currentProfile.id;
    document.getElementById('postModal').style.display = 'flex';
    await loadPostModalData(post);
}

async function loadPostModalData(post) {
    const commentsEl = document.getElementById('pmComments');
    commentsEl.innerHTML = '<div style="color:var(--text-2);font-size:13px;">Loading…</div>';
    const [likesRes, commentsRes, myLikeRes] = await Promise.all([
        sb.from('likes').select('*', { count:'exact', head:true }).eq('post_id', post.id),
        sb.from('comments').select('*, profiles:user_id(name, avatar_url)').eq('post_id', post.id).order('created_at', { ascending:true }),
        sb.from('likes').select('id').eq('post_id', post.id).eq('user_id', currentUser.id).maybeSingle()
    ]);
    pmLikeCount = likesRes.count || 0;
    pmLiked = !!myLikeRes.data;
    const likeBtn = document.getElementById('pmLikeBtn');
    likeBtn.textContent = pmLiked ? '❤️' : '🤍';
    document.getElementById('pmLikeCount').textContent = pmLikeCount + ' like' + (pmLikeCount !== 1 ? 's' : '');
    const comments = commentsRes.data || [];
    let html = '';
    if (post.caption) html += '<div class="post-modal-caption"><strong>' + escapeHtml(currentProfile.name || 'Member') + '</strong>' + escapeHtml(post.caption) + '</div>';
    if (comments.length === 0) {
        html += '<div style="color:var(--text-2);font-size:13px;margin-top:8px;">No comments yet. Be the first!</div>';
    } else {
        html += comments.map(c => {
            const u = c.profiles || {};
            return '<div class="pm-comment"><img src="' + (u.avatar_url || defaultAvatar(u.name)) + '" alt=""><div class="pm-comment-body"><span><strong>' + escapeHtml(u.name || 'User') + '</strong> ' + escapeHtml(c.text) + '</span><div class="pm-time">' + timeAgo(c.created_at) + '</div></div></div>';
        }).join('');
    }
    commentsEl.innerHTML = html;
    commentsEl.scrollTop = commentsEl.scrollHeight;
}

async function togglePostModalLike() {
    if (!currentPostId) return;
    if (pmLiked) {
        await sb.from('likes').delete().eq('post_id', currentPostId).eq('user_id', currentUser.id);
        pmLiked = false; pmLikeCount = Math.max(0, pmLikeCount - 1);
    } else {
        await sb.from('likes').insert({ post_id: currentPostId, user_id: currentUser.id });
        pmLiked = true; pmLikeCount++;
    }
    document.getElementById('pmLikeBtn').textContent = pmLiked ? '❤️' : '🤍';
    document.getElementById('pmLikeCount').textContent = pmLikeCount + ' like' + (pmLikeCount !== 1 ? 's' : '');
}

async function postModalComment() {
    const input = document.getElementById('pmCommentInput');
    const text = input.value.trim();
    if (!text || !currentPostId) return;
    const btn = document.getElementById('pmCommentPost');
    btn.disabled = true;
    const { error } = await sb.from('comments').insert({ post_id: currentPostId, user_id: currentUser.id, text });
    if (!error) { input.value = ''; const post = profilePosts.find(p => p.id === currentPostId); if (post) await loadPostModalData(post); }
    btn.disabled = false;
}
document.getElementById('pmCommentInput').addEventListener('input', function() { document.getElementById('pmCommentPost').disabled = !this.value.trim(); });
document.getElementById('pmCommentInput').addEventListener('keydown', e => { if (e.key === 'Enter') postModalComment(); });

function closePostModal() {
    document.getElementById('postModal').style.display = 'none';
    currentPostId = null;
    const vid = document.querySelector('#postModalMedia video');
    if (vid) vid.pause();
}
document.getElementById('postModal').addEventListener('click', e => { if (e.target === document.getElementById('postModal')) closePostModal(); });

/* Edit modal */
document.getElementById('editProfileBtn').addEventListener('click', () => { document.getElementById('editModal').style.display = 'flex'; });
document.getElementById('closeEditModal').addEventListener('click', () => { document.getElementById('editModal').style.display = 'none'; });
document.getElementById('editModal').addEventListener('click', e => { if (e.target === document.getElementById('editModal')) document.getElementById('closeEditModal').click(); });

document.getElementById('saveProfileBtn').addEventListener('click', async () => {
    const occField = document.getElementById('editOccField').value;
    const occOther = document.getElementById('editOccOther').value.trim();
    const updates = {
        bio: document.getElementById('editBio').value.trim(),
        residence_city: document.getElementById('editCity').value.trim(),
        education: document.getElementById('editEducation').value.trim(),
        occupation_type: document.getElementById('editOccType').value,
        occupation_field: occField === 'other' ? occOther : occField,
        past_experience: document.getElementById('editPastExp').value.trim(),
        birth_date: document.getElementById('editBirthDate').value || null,
        marital_status: document.getElementById('editMaritalStatus').value
    };
    const { error } = await sb.from('profiles').update(updates).eq('id', currentUser.id);
    if (error) { alert('Error: ' + error.message); return; }
    Object.assign(currentProfile, updates);
    updateProfileHeader(currentProfile);
    renderDetailGrid(currentProfile);
    document.getElementById('closeEditModal').click();
});
</script>
</body>
</html>
