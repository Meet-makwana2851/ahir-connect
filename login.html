<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — AhirConnect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/style.css">
<script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
<div class="feather-bg"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row"><span class="brand">Ahir<span>Connect</span></span></div>
    <div class="tagline">Jai Shree Krishna 🦚 — Connecting the Ahir Samaj, everywhere.</div>
    <div class="error-msg" id="authError"></div>

    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Log In</button>
    </form>

    <div class="switch-auth">New here? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<script src="shared/config.js"></script>
<script>
// If already logged in, skip straight to the app
sb.auth.getSession().then(({ data: { session } }) => {
  if(session) window.location.href = 'home.html';
});

function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg; el.style.display = 'block';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in...';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ showAuthError(error.message); btn.disabled = false; btn.textContent = 'Log In'; return; }
  window.location.href = 'home.html';
});
</script>
</body>
</html>
