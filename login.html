<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — AhirConnect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="shared/style.css">
<script>if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row"><span class="brand">Ahir<span>Connect</span></span></div>
    <div class="tagline">Jai Shree Krishna 🦚 — Connecting the Ahir Samaj, everywhere.</div>
    <div class="error-msg" id="authError"></div>

    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required placeholder="Email"></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required placeholder="Password"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn" style="margin-top:6px;">Log In</button>
    </form>

    <div class="or-divider">OR</div>

    <div class="switch-auth">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>
</div>

<script src="shared/config.js"></script>
<script>
// If already logged in, skip straight to the app
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(session?.user) window.location.href = 'home.html';
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in...';

  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(),
    password: document.getElementById('loginPassword').value
  });

  if(error){
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log In';
  } else {
    window.location.href = 'home.html';
  }
});
</script>
</body>
</html>
