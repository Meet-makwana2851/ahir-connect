<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Ahir Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="shared/style.css">
    <script>
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
</head>

<body>
    <div class="auth-wrap">
        <div class="auth-card" style="border-radius:18px; border:1px solid var(--border-gold); box-shadow:var(--shadow-md);">
            <div class="brand-row">
                <span class="brand"><span style="color:var(--text);">Ahir</span><span style="color:var(--accent);"> Connect</span></span>
            </div>
            <div class="tagline" style="color:var(--text-2); font-weight:500; margin-bottom:18px;">
                <span style="font-size:13px;">Connecting the Ahir Samaj & Yaduvanshis everywhere</span>
            </div>
            <div class="error-msg" id="authError"></div>

            <form id="loginForm">
                <div class="field"><label>Email</label><input type="email" id="loginEmail" required placeholder="Email"></div>
                <div class="field"><label for="loginPassword">Password</label><div class="password-field"><input type="password" id="loginPassword" required placeholder="Password"><button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.5 17.5 0 0 1-3.1 3.5"/><path d="M6.2 6.2C3.6 8 2 12 2 12s3.5 6 10 6c1.3 0 2.4-.2 3.4-.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div></div>
                <button class="btn btn-primary" type="submit" id="loginBtn" style="margin-top:8px; border-radius:9999px; background:var(--accent);">Log In</button>
            </form>

            <div class="or-divider">OR</div>

            <div class="switch-auth">Don't have an account? <a href="signup.html" style="font-weight:700; color:var(--peacock-teal);">Sign up</a></div>
        </div>
    </div>
    <div class="account-toast" id="accountToast" role="status" aria-live="polite">Account created successfully</div>

    <script src="shared/config.js"></script>
    <script>
        // If already logged in, skip straight to the app
        (async() => {
            const justCreated = new URLSearchParams(window.location.search).get('created') === '1';
            if (justCreated) {
                const toast = document.getElementById('accountToast');
                toast.classList.add('visible');
                window.history.replaceState({}, document.title, 'login.html');
                window.setTimeout(() => toast.classList.remove('visible'), 5000);
            }
            const {
                data: {
                    session
                }
            } = await sb.auth.getSession();
            if (session?.user && !justCreated) window.location.href = 'home.html';
        })();

        document.getElementById('loginForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const errEl = document.getElementById('authError');
            errEl.style.display = 'none';
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            const {
                error
            } = await sb.auth.signInWithPassword({
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPassword').value
            });

            if (error) {
                errEl.textContent = error.message;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log In 🪶';
            } else {
                window.location.href = 'home.html';
            }
        });

        document.querySelectorAll('[data-password-toggle]').forEach(toggle => {
            toggle.addEventListener('click', () => {
                const input = document.getElementById(toggle.dataset.passwordToggle);
                const isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
                toggle.querySelector('.eye-open').hidden = !isVisible;
                toggle.querySelector('.eye-closed').hidden = isVisible;
            });
        });
    </script>
</body>

</html>
